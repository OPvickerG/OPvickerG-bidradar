# OPvickerG BidRadar — scheduled scanner on GitHub Actions (zero-cost hosting option).
# GitHub cron is in UTC. IST = UTC+5:30, so minute 0 and minute 30 UTC are exactly :30 and :00 IST:
# every IST :00 and :30 slot is covered. Two entries let the scanner know which slot a (possibly late) run is for.
name: BidRadar scan

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Run type"
        type: choice
        options: [manual, scheduler]
        default: manual

concurrency:
  group: bidradar-scan          # never two scans at once (the database lock is a second safety net)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    # GeM only accepts connections from India, so scans run on the self-hosted runner in Oracle Mumbai.
    runs-on: [self-hosted, india]
    timeout-minutes: 28
    env:
      APP_ENV: production
      TZ: UTC
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'console' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SCANNER_REQUEST_DELAY: ${{ vars.SCANNER_REQUEST_DELAY || '3' }}
      SCHEDULED_MINUTE: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 * * * *' && '30' || '0') || '' }}
      SCAN_TRIGGER: ${{ github.event_name == 'schedule' && 'scheduler' || inputs.trigger }}
    steps:
      - name: Resolve database connection
        # Either set the DATABASE_URL secret, or install the Neon GitHub integration (it adds the NEON_API_KEY
        # secret and NEON_PROJECT_ID variable); the pooled connection string is then fetched from Neon's API
        # at run time and masked in logs. It is never written to the repository.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE: ${{ vars.NEON_DATABASE || 'neondb' }}
          NEON_ROLE: ${{ vars.NEON_ROLE || 'neondb_owner' }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "Using DATABASE_URL secret"; exit 0; fi
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::No database configured: set the DATABASE_URL secret or install the Neon GitHub integration"; exit 1
          fi
          uri=$(curl -sSf -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?database_name=$NEON_DATABASE&role_name=$NEON_ROLE&pooled=true" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["uri"])')
          echo "::add-mask::$uri"
          echo "DATABASE_URL=$uri" >> "$GITHUB_ENV"
          echo "Database connection resolved from Neon project $NEON_PROJECT_ID"
      - uses: actions/checkout@v4
      - name: Install (persistent virtualenv on the runner, rebuilt when requirements change)
        run: |
          VENV="$HOME/bidradar-venv"
          STAMP="$VENV/.req-$(sha256sum requirements.txt | cut -c1-16)"
          if [ ! -f "$STAMP" ]; then
            rm -rf "$VENV" && python3 -m venv "$VENV"
            "$VENV/bin/pip" install --quiet --upgrade pip
            "$VENV/bin/pip" install --quiet -r requirements.txt
            touch "$STAMP"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Migrate database
        run: alembic upgrade head
      - name: Scan
        run: python -m scanner.scheduler.run --trigger "$SCAN_TRIGGER"
