# OPvickerG BidRadar — business category knowledge base.
# phrases:   the user's own service names + close variants (strongest signal)
# synonyms:  alternative wording procurement documents actually use
# discovery: short search terms sent to portal search boxes (kept few: each costs a request)
# objects / actions: the concept model. A tender matches semantically when an OBJECT the business works on
#            co-occurs (nearby) with an ACTION the business performs.
# negatives: contexts that mean "not this business" (e.g. document scanners, medical diagnostics)
# supply_only_penalty: true where buying NEW equipment (not repair/service) is out of scope

